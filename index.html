<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta name="google" content="notranslate">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus QR - Advanced Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- External Libraries -->
    <!-- Raw Matrix Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    
    <!-- Utils -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
            },
            colors: {
              gray: {
                50: '#f9fafb',
                100: '#f5f5f5', // Your specific bg color
                800: '#333333', // Your specific primary dark
                900: '#111827',
              }
            },
            boxShadow: {
              'card': '0 2px 20px rgba(0, 0, 0, 0.1)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #f5f5f5;
        font-family: 'Poppins', sans-serif;
      }
      
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      
      /* Custom Inputs to match original design */
      .custom-input {
        background: #f5f5f5;
        border: 1px solid transparent;
        transition: all 0.2s;
      }
      .custom-input:focus {
        background: #f0f0f0;
        outline: none;
        border-color: #e5e5e5;
      }
      
      input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      input[type="color"]::-webkit-color-swatch {
        border: none;
        border-radius: 8px;
      }

      /* Animations */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fadeIn {
        animation: fadeIn 0.2s ease-out;
      }
      .animate-slideUp {
        animation: slideUp 0.3s ease-out;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "qrcode.react": "https://aistudiocdn.com/qrcode.react@^4.2.0"
  }
}
</script>
</head>
  <body class="p-2 md:p-4 min-h-screen notranslate">
    <!-- Eruda Console for Mobile Debugging -->
    <!-- Enable: Add ?debug=true to URL OR type localStorage.setItem('debug','true') in console -->
    <!-- Disable: Add ?debug=false OR type localStorage.removeItem('debug') -->
    <script>
      (function() {
        var urlParams = new URLSearchParams(window.location.search);
        var debugParam = urlParams.get('debug');

        // If URL has debug parameter, save preference
        if (debugParam === 'true') {
          localStorage.setItem('nexus_debug', 'true');
        } else if (debugParam === 'false') {
          localStorage.removeItem('nexus_debug');
        }

        // Check if debug mode is enabled (from URL or localStorage)
        var isDebugMode = debugParam === 'true' || localStorage.getItem('nexus_debug') === 'true';

        if (isDebugMode) {
          var script = document.createElement('script');
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/eruda/3.0.1/eruda.min.js';
          script.integrity = 'sha512-KsDfJaH1p7V7Yr2pHfXfnnnDk0PoaH4u4H81NPZHrGNDABwPJBxjjjQOEZHlM02xq3ORhBytww8yuogxav0Glg==';
          script.crossOrigin = 'anonymous';
          script.onload = function() {
            eruda.init({
              tool: ['console', 'elements', 'network', 'resources', 'info'],
              useShadowDom: true,
              defaults: {
                displaySize: 50,
                transparency: 0.9
              }
            });
            console.log('🔧 Eruda Debug Console loaded!');
            console.log('📱 To disable: Add ?debug=false to URL');
          };
          script.onerror = function() {
            console.error('Failed to load Eruda debug console');
          };
          document.head.appendChild(script);
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
