                  country:
                    type: string
                  city:
                    type: string
                  device:
                    type: string
                  browser:
                    type: string
                  os:
                    type: string
                  referrer:
                    type: string
            pagination:
              $ref: '#/components/schemas/Pagination'

    BulkCreateRequest:
      type: object
      required:
        - qr_codes
      properties:
        qr_codes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required:
              - url
            properties:
              url:
                type: string
                format: uri
              title:
                type: string
        default_style:
          $ref: '#/components/schemas/QRCodeStyle'
        default_type:
          type: string
          enum: [static, dynamic]
          default: dynamic

    BulkCreateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            batch_id:
              type: string
              description: ID for tracking async batch operations
            created:
              type: integer
              description: Number of QR codes created
            failed:
              type: integer
              description: Number of failed creations
            items:
              type: array
              items:
                type: object
                properties:
                  index:
                    type: integer
                  qr_id:
                    type: string
                  status:
                    type: string
                    enum: [created, failed]
                  error:
                    type: string

    Webhook:
      type: object
      properties:
        id:
          type: string
          example: "wh_def456uvw012"
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_triggered_at:
          type: string
          format: date-time
        success_rate:
          type: number
