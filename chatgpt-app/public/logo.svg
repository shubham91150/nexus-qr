<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#gradient)"/>

  <!-- QR Code Pattern -->
  <g fill="white">
    <!-- Top-left corner -->
    <rect x="15" y="15" width="20" height="20" rx="3"/>
    <rect x="18" y="18" width="14" height="14" rx="2" fill="url(#gradient)"/>
    <rect x="22" y="22" width="6" height="6" rx="1" fill="white"/>

    <!-- Top-right corner -->
    <rect x="65" y="15" width="20" height="20" rx="3"/>
    <rect x="68" y="18" width="14" height="14" rx="2" fill="url(#gradient)"/>
    <rect x="72" y="22" width="6" height="6" rx="1" fill="white"/>

    <!-- Bottom-left corner -->
    <rect x="15" y="65" width="20" height="20" rx="3"/>
    <rect x="18" y="68" width="14" height="14" rx="2" fill="url(#gradient)"/>
    <rect x="22" y="72" width="6" height="6" rx="1" fill="white"/>

    <!-- Data dots -->
    <rect x="40" y="15" width="6" height="6" rx="1"/>
    <rect x="50" y="15" width="6" height="6" rx="1"/>

    <rect x="15" y="40" width="6" height="6" rx="1"/>
    <rect x="25" y="40" width="6" height="6" rx="1"/>
    <rect x="40" y="40" width="6" height="6" rx="1"/>
    <rect x="50" y="40" width="6" height="6" rx="1"/>
    <rect x="65" y="40" width="6" height="6" rx="1"/>
    <rect x="79" y="40" width="6" height="6" rx="1"/>

    <rect x="15" y="50" width="6" height="6" rx="1"/>
    <rect x="40" y="50" width="6" height="6" rx="1"/>
    <rect x="65" y="50" width="6" height="6" rx="1"/>
    <rect x="75" y="50" width="6" height="6" rx="1"/>

    <rect x="40" y="65" width="6" height="6" rx="1"/>
    <rect x="50" y="65" width="6" height="6" rx="1"/>
    <rect x="65" y="65" width="6" height="6" rx="1"/>

    <rect x="40" y="79" width="6" height="6" rx="1"/>
    <rect x="65" y="79" width="6" height="6" rx="1"/>
    <rect x="79" y="79" width="6" height="6" rx="1"/>
  </g>
</svg>
